<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular con gradiente -->
  <circle cx="256" cy="256" r="248" fill="url(#gradient)" stroke="#818cf8" stroke-width="16"/>
  
  <!-- Símbolo de dopamina estilizado -->
  <path d="M256 120
           C 180 120, 140 200, 140 256
           C 140 312, 180 392, 256 392
           C 332 392, 372 312, 372 256
           C 372 200, 332 120, 256 120
           M256 180
           C 300 180, 320 220, 320 256
           C 320 292, 300 332, 256 332
           C 212 332, 192 292, 192 256
           C 192 220, 212 180, 256 180
           Z" 
        fill="#818cf8" fill-opacity="0.8"/>
  
  <!-- Puntos de conexión neuronal -->
  <circle cx="256" cy="140" r="12" fill="#ffffff"/>
  <circle cx="256" cy="372" r="12" fill="#ffffff"/>
  <circle cx="160" cy="256" r="12" fill="#ffffff"/>
  <circle cx="352" cy="256" r="12" fill="#ffffff"/>
  
  <!-- Definición del gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
</svg> 